<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Kamai Saathi — Money clarity. Safer choices.</title>
    <meta name="description" content="An intelligent, inclusive financial companion for everyday Indian earners. Voice logging, irregular income forecasting, loan simulator, Scam Shield, and verified government schemes." />
    <meta property="og:title" content="Kamai Saathi — Money clarity. Safer choices." />
    <meta property="og:description" content="An intelligent, inclusive financial companion for everyday Indian earners. Voice logging, irregular income forecasting, loan simulator, Scam Shield, and verified government schemes." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0B132B" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('kamai_saathi_theme');
          const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (theme === 'dark' || (!theme && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 antialiased selection:bg-amber-200 selection:text-amber-900 min-h-screen transition-colors duration-150">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
